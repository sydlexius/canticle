# Version is derived from git tags via GoReleaser ldflags (stamped into
# internal/version at build time); there is no checked-in version file.

[build]
working_dir = "."

# DO NOT re-add `go test` or `golangci-lint` here -- they belong to the hook,
# and this step ASSERTS THE HOOK IS WIRED instead of duplicating its work.
#
# When core.hooksPath points at .githooks, `.githooks/pre-push` execs
# scripts/pre-push-gate.sh on EVERY push, the release tag push included. That
# gate runs both checks this list used to carry -- `go test -race` with coverage
# and golangci-lint -- unconditionally, plus govulncheck, actionlint, patch
# coverage and the coverage-floor ratchet.
#
# So a `go test ./...` here is a REPEAT of what the hook just ran, and the
# weaker of the two (no -race, no coverage). Measured cutting v1.37.1: the tag
# push printed "OK: all pre-push checks passed" from the hook, on a commit CI
# had already gated identically at PR time.
#
# NOTE what does NOT happen, because an earlier version of this comment claimed
# it and was wrong: CI does NOT re-run the suite on the pushed TAG. ci.yml
# triggers only on `push: branches: [main]` and `pull_request`; release.yml
# triggers on tags but runs GoReleaser alone, with no test, lint or vulncheck
# step. The real argument is the PR-time gate above, not a tag-time one.
#
# BUT core.hooksPath IS NOT TRACKED -- it lives in .git/config, so it is set per
# clone by `make hooks` and a fresh clone has it UNSET. Git cannot require a
# client-side hook (a repo that ran code on clone would be an RCE vector), so
# the wiring is asserted at the point of use rather than assumed. check-hooks.sh
# exits non-zero with remediation guidance when it is missing, which turns the
# comment above from a claim into a precondition. It reads a git config value:
# cheap enough to run every release, unlike the suite it stands in for.
#
# Releases are cut by a small, known set of people, so requiring the wiring here
# costs them one `make hooks` per clone and removes the case where a release is
# tagged with no local gate at all.
#
# The command is ANCHORED TO THE REPO ROOT rather than written relative to the
# working directory. `working_dir = "."` is the caller's cwd, which is not
# guaranteed to be the root: run from a subdirectory, a bare `bash
# scripts/check-hooks.sh` exits 127 with "No such file or directory", which
# reads as a deleted script rather than a wrong cwd. `git rev-parse
# --show-toplevel` is the same answer the script itself uses to orient.
#
# Anything else that must gate a RELEASE and is not already in the gate belongs
# in scripts/pre-push-gate.sh, where every push gets it rather than only the
# releases that happen to run through this skill.
pre_checks = [
  "bash \"$(git rev-parse --show-toplevel)/scripts/check-hooks.sh\"",
]

# Section grouping for generated release notes. Maps a merged PR's GitHub label
# to the heading it lands under, matching the headings the last several releases
# actually used. Without this, grouping is re-decided by judgment every release.
#
# PRECEDENCE: a PR commonly carries several of these (a bug fix labeled `go`, or
# an `enhancement` also labeled `priority: high`). The change-kind labels win over
# the catch-all buckets -- prefer `enhancement`/`bug` over `documentation`/`chore`/
# `go`/`docker` when a PR carries both. Priority labels are deliberately absent:
# they describe urgency, not the kind of change, so they never select a section.
#
# This governs GROUPING only. The surrounding structure -- the `### Highlights`
# prose for a minor release, and the Docker-pull / full-changelog footer -- is not
# expressible here; follow the previous release (`gh release view <prev-tag>`).
#
# ---------------------------------------------------------------------------
# THE DETECTOR SIDECAR MUST BE ADDRESSED IN EVERY RELEASE (#682)
# ---------------------------------------------------------------------------
# Every release publishes a `canticle-yamnet` image tagged with CANTICLE's
# version, whether or not the sidecar changed. So the tag records WHEN it was
# built, not WHAT changed in it, and two functionally identical tags look exactly
# like two different ones. State which it is, explicitly:
#
#   - Sidecar UNCHANGED -> say so, in the upgrade notes:
#       "No detector-sidecar changes in this release; `X.Y.Z` is identical in
#        substance to `X.Y.(Z-1)`."
#     That one sentence is the entire point: it is what lets an operator skip a
#     ~1.56GB pull.
#
#   - Sidecar CHANGED -> say what changed, and whether the BAKED MODEL moved.
#     A model change is the case that actually matters: the three-gate detector
#     thresholds are calibrated against a specific model, and a swap invalidates
#     stored verdicts (they re-infer -- correct, but a real I/O cost). Never ship
#     a model change silently.
#
# Check it mechanically rather than from memory:
#   git diff --stat <prev-tag>..HEAD -- deploy/yamnet-detector/
#   git diff <prev-tag>..HEAD -- deploy/yamnet-detector/Dockerfile | grep YAMNET_SHA256
# An empty first result means UNCHANGED; a hit on the second means THE MODEL MOVED.
#
# The published image also carries the model identity as OCI labels, so a reader
# can verify any claim here without pulling:
#   docker buildx imagetools inspect ghcr.io/sydlexius/canticle-yamnet:X.Y.Z \
#     --format '{{json .Image.Config.Labels}}'
#
# WORD CHOICE: "sidecar" is ambiguous in this project and has already misled a
# reader. It means BOTH the lyric sidecar files (.lrc/.txt written next to audio)
# and the detector container. v1.29.0's notes contained seven hits for "sidecar",
# every one about lyric files, in a release that published a detector image that
# had not changed. Always qualify: "lyric sidecar" or "detector sidecar", never
# bare "sidecar". Same for "detector", which also names telemetry rows in the DB.
[release_notes]
default_group = "Maintenance"

[release_notes.group_labels]
enhancement = "New"
bug = "Bug fixes"
dependencies = "Security & dependencies"
ci = "Security & dependencies"
documentation = "Maintenance"
chore = "Maintenance"
go = "Maintenance"
docker = "Maintenance"

[release]
tag_prefix = "v"
