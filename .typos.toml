# typos-cli configuration
# https://github.com/crate-ci/typos

[files]
extend-exclude = [
    "go.sum",
    "web/static/fonts/",
    "web/static/css/output.css",
    # Vendored, minified third-party JS (htmx): its mangled identifiers trip the
    # spell checker and are not ours to edit.
    "web/static/js/",
]

[default]
# Enforce US English across ALL files (misspell in golangci-lint only covers
# .go sources; this extends US-spelling enforcement to markdown, comments, and
# everything else typos scans -- e.g. modelling -> modeling, queueing -> queuing).
locale = "en-us"
# Ignore git commit hashes (7-40 hex chars) to avoid false positives on hash substrings.
# Also the exact literal of internal/innertube's opaque base64-encoded innertube
# search "params" blob (issue #854, songs-only shelf filter, 854-F3): it is an
# undocumented, reverse-engineered wire value, not prose -- changing it would
# change what the API returns. Scoped to the exact string (not a bare word
# allowlist like [default.extend-words], which is case-insensitive and
# repo-wide) so it does not mask the unrelated "ake"/"AKE" -> "ache"/"ACHE"
# misspelling anywhere else in the repo, mirroring the reasoning documented
# below for MisSynced: allowlist as an IDENTIFIER/literal, not as a word.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b", "Eg-KAQwIARAAGAAgACgAMABqChAEEAUQAxAKEAk="]

[default.extend-words]
# ID3v2 frame names are not English words; typos extracts the alpha portion (e.g. TPE from TPE1)
TIT2 = "TIT2"
TPE1 = "TPE1"
TPE = "TPE"
TPOS = "TPOS"
TCON = "TCON"
TDRC = "TDRC"
TRCK = "TRCK"
TCOM = "TCOM"
TSRC = "TSRC"
# typos' en-us locale does not flag -logue/-log variants, so enforce the US
# spelling explicitly (the repo standard; the rest of the tree uses "catalog").
catalogue = "catalog"
# The Petit Lyrics API really does spell its field <prefferedLyricsType>. It is a
# wire-protocol identifier, not prose: "correcting" it in the test fixtures would
# make them stop matching the responses they exist to represent.
preffered = "preffered"
[default.extend-identifiers]
# MisSynced is the timing-outcome type name fixed by issue #438. typos splits
# the identifier and reads the "mis" stem as a misspelling of "miss"/"mist".
# Allowlisted as IDENTIFIERS, not as a word: a bare "mis" in prose stays flagged,
# so a real "miss" typo is still caught. Note typos splits on the hyphen before
# any lookup, so "mis-synced" cannot be allowlisted as a unit -- prose therefore
# says "MisSynced" (the type) rather than the hyphenated adjective.
MisSynced = "MisSynced"
mis_synced = "mis_synced"
# The [timing_validation] config key and its Go field carry the same "mis" stem
# for the same reason: the key names the outcome it acts on, and renaming either
# to satisfy the spell checker would break the correspondence with mis_synced.
on_mis_synced = "on_mis_synced"
OnMisSynced = "OnMisSynced"
MXLRC_TIMING_VALIDATION_ON_MIS_SYNCED = "MXLRC_TIMING_VALIDATION_ON_MIS_SYNCED"
timingMisSyncedActions = "timingMisSyncedActions"
# revalidate's per-arm remediation actions (#443). Each is a WHOLE identifier
# here because typos matches whole identifiers, so allowlisting "MisSynced"
# alone does not cover a name it appears inside.
MisSyncedAction = "MisSyncedAction"
misSyncedMove = "misSyncedMove"
misSyncedActions = "misSyncedActions"
misSynced = "misSynced"
