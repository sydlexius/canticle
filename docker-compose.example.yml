# Forced-alignment sidecar settings shared by the CPU and GPU services below
# (one anchor, so the two cannot drift). Only the image/build variant and the
# NVIDIA device reservation differ.
x-aligner-common: &aligner-common
  restart: unless-stopped
  # No published port: the endpoint is unauthenticated. Canticle reaches it at
  # http://aligner:8080 through the shared network alias below.
  expose:
    - "8080"
  networks:
    default:
      # BOTH services answer to this one name; only one runs at a time (the two
      # profiles are alternatives), so MXLRC_WORD_SYNC_GENERATE_URL never changes.
      aliases:
        - aligner
  volumes:
    # Demucs / faster-whisper / wav2vec2 weights download here on first use.
    # The image runs as uid 1000; a named volume inherits that ownership.
    - aligner-data:/data
  # Requests run one at a time; this bounds a burst, not throughput.
  cpus: "4"
  mem_limit: 8g
  healthcheck:
    # The slim image has no curl/wget; /health is liveness only (models load
    # lazily on the first /align).
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  canticle:
    image: ghcr.io/sydlexius/canticle:latest
    container_name: canticle
    restart: unless-stopped
    ports:
      - "50705:50705"
    environment:
      MXLRC_DOCKER: "true"
      MXLRC_SERVER_ADDR: "0.0.0.0:50705"
      # Enable the browser UI (overrides web_ui_enabled in config.toml).
      MXLRC_WEB_UI_ENABLED: "true"
      # Bootstrap the first web-UI admin on a headless host (the /setup page is
      # loopback/trusted-CIDR only). Both vars are required; the password must be
      # at least 8 characters. The bootstrap is idempotent (skipped once an admin
      # exists). Rotate the password in the UI and remove these vars after first
      # login. See docs/USER_GUIDE.md "Web UI enablement" for secret-hygiene guidance.
      # Supply MXLRC_WEBAUTH_ADMIN_PASSWORD from an uncommitted .env file -- never hardcode it here.
      # MXLRC_WEBAUTH_ADMIN_USER: "admin"
      # MXLRC_WEBAUTH_ADMIN_PASSWORD: "${MXLRC_WEBAUTH_ADMIN_PASSWORD}"
      # Optional: enable the instrumental-detection sidecar defined below. Both
      # are needed -- the detector stays off unless explicitly enabled.
      # MXLRC_INSTRUMENTAL_DETECTOR_ENABLED: "true"
      # MXLRC_INSTRUMENTAL_DETECTOR_CLASSIFIER_URL: "http://yamnet:8080"
      PUID: "99"
      PGID: "100"
      MUSIXMATCH_TOKEN: "${MUSIXMATCH_TOKEN}"
      MXLRC_WEBHOOK_API_KEY: "${MXLRC_WEBHOOK_API_KEY}"
      # Optional: master key for encrypted-at-rest secrets (base64 of 32 bytes).
      # When set, takes precedence over the auto-generated key file and keeps the
      # key off the data volume (recommended for whole-volume-theft protection).
      # Generate once with: openssl rand -base64 32
      # Source from a .env file kept OUTSIDE the /config volume so the key and
      # the database are not in the same place.
      # Omit to use the zero-setup default: a 0600 key file auto-created at
      # /config/.mxlrcgo.key. See docs/USER_GUIDE.md "Encrypted secrets".
      MXLRC_MASTER_KEY: "${MXLRC_MASTER_KEY}"
    volumes:
      - canticle-config:/config
      - /path/to/your/data:/data:rw

  # Optional instrumental-detection sidecar. Canticle POSTs a 16 kHz mono WAV to
  # http://yamnet:8080/classify and uses the AudioSet scores to decide whether to
  # write an instrumental marker. Omit this service to run without detection --
  # the detector is strictly opt-in and Canticle degrades cleanly without it.
  #
  # There is no published image yet (see issue #498), so this builds from the
  # vendored source under deploy/yamnet-detector/.
  yamnet:
    build:
      context: ./deploy/yamnet-detector
    image: canticle-yamnet:local
    container_name: canticle-yamnet
    restart: unless-stopped
    # No published port: Canticle reaches it by service name on the shared
    # compose network. Do not expose it -- the endpoint is unauthenticated.
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          # TensorFlow parallelizes a forward pass across every core it can see,
          # so an uncapped sidecar will happily consume the whole host during a
          # scan and starve everything else on it. Cap it.
          #
          # 4 CPUs is a deliberately conservative default that keeps the sidecar
          # a good neighbor on a modest host.
          #
          # THIS IS AN ISOLATION KNOB, NOT A THROUGHPUT KNOB. An earlier version
          # of this comment claimed inference is "the dominant cost in the
          # detector path (measured at ~40-67s per track)" and told you to size
          # this against it. That number is wrong by roughly 300x -- it almost
          # certainly timed the whole detector path (ffmpeg reading audio off the
          # array, plus a cold model load) rather than the classify call. Measured
          # against a running sidecar, canticle 1.30.1:
          #
          #   /classify, 30s sample (typical)     0.07-0.11s
          #   /classify, 60s sample (the longest) 0.13-0.24s
          #   ffmpeg spread-sample extraction     ~0.10s
          #
          # So inference is a fifth of a second, and raising this limit buys
          # almost no throughput. What it does buy is a bound on how much of the
          # host TensorFlow grabs during a burst, which matters more now that the
          # serve-mode backfill sweep runs detection flat-out in short cycles.
          # Raise it on a host with cores to spare, lower it on a busy one -- but
          # size the DETECTOR's throughput with the knobs in
          # [instrumental_detector.backfill] instead (see docs/DEPLOYMENT.md).
          cpus: "4"
          # The SavedModel plus the TF runtime sit around 1.5GB resident.
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The model is loaded at startup, so the first probe must not race it.
      start_period: 60s

  # Optional word-sync forced-alignment sidecar (deploy/aligner, issue #1005),
  # EXPERIMENTAL and off unless Canticle's [word_sync_generate] is configured
  # (MXLRC_WORD_SYNC_GENERATE_ENABLED plus MXLRC_WORD_SYNC_GENERATE_URL:
  # "http://aligner:8080"). Pick ONE profile; do not start both:
  #   docker compose --profile aligner up -d       # CPU (amd64 or arm64)
  #   docker compose --profile aligner-gpu up -d   # NVIDIA GPU (amd64 only)
  # Profiled services never start under a plain `docker compose up`.
  # Like the yamnet service, both build from the vendored source under
  # deploy/aligner and tag the result locally (canticle-aligner:local and
  # :local-cuda), so a local build never overwrites a ghcr tag. Sizes: CPU is
  # ~0.65 GB compressed / ~2.8 GB unpacked; the CUDA image adds ~3.5 GB to pull
  # and ~9.3 GB on disk.
  # Published images (ghcr.io/sydlexius/canticle-aligner:latest and :latest-cuda)
  # exist only once a release tag has been pushed AND the GHCR package has been
  # made public (see deploy/aligner/README.md); until then, build locally. Once
  # available, swap the `image:` line for the ghcr tag and run
  # `docker compose pull` instead of `build`.
  aligner:
    <<: *aligner-common
    profiles: ["aligner"]
    build:
      context: ./deploy/aligner
    image: canticle-aligner:local
    container_name: canticle-aligner

  # GPU variant: same sidecar built with VARIANT=cuda (see the sizes above). Needs an
  # NVIDIA driver and the NVIDIA Container Toolkit on the Docker host (Linux
  # only; Docker Desktop on macOS has no GPU passthrough). ALIGNER_DEVICE stays
  # "auto", so a host without a usable GPU falls back to CPU instead of failing;
  # confirm with: curl http://<container-ip>:8080/health  ("device": "cuda").
  aligner-gpu:
    <<: *aligner-common
    profiles: ["aligner-gpu"]
    build:
      context: ./deploy/aligner
      args:
        VARIANT: cuda
    image: canticle-aligner:local-cuda
    container_name: canticle-aligner-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  canticle-config:
  aligner-data:
