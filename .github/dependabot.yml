version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5
    groups:
      # CodeQL sub-actions (init/analyze/autobuild) cross-check versions at
      # runtime and must move in lockstep; group them so a bump never splits
      # init and analyze across separate PRs (which fails with a config
      # version-mismatch error).
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /build/docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 5

  # The YAMNet sidecar's Python deps. This ecosystem was MISSING while gomod,
  # github-actions, and docker were all covered, so every pinned Python
  # dependency aged silently and Scorecard's Vulnerabilities alert was the only
  # thing that noticed -- after the fact, on main.
  #
  # It is not a hypothetical gap: pinning pytest==8.3.4 (issue #636) landed a
  # version carrying PYSEC-2026-1845, and the pin made it permanent where the
  # previous unpinned install had floated to a patched release. Hash pinning
  # removes the drift that used to accidentally paper over an aging pin, so the
  # pins now REQUIRE an update mechanism rather than merely benefiting from one.
  #
  # Dependabot regenerates the --require-hashes hashes on a bump, so both the
  # runtime lock and the test lock stay installable.
  - package-ecosystem: pip
    directory: /deploy/yamnet-detector
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      # The test tools move together and are never load-bearing at runtime, so a
      # single PR per week beats three that each re-trigger the sidecar build.
      yamnet-test-deps:
        patterns:
          - "pytest*"
          - "httpx"

  # The aligner sidecar's Python deps, now that its generated locks
  # (requirements-linux-amd64.txt / requirements-linux-arm64.txt /
  # requirements-test.txt) are fully hash-pinned (issue #1017, mirroring the
  # yamnet entry above). requirements.in/requirements-test.in themselves carry
  # exact-version pins, not hashes -- the hashes live only in the generated
  # locks those files compile to.
  #
  # What is actually known: Dependabot's pip ecosystem understands
  # pip-compile-style constraint files, so it should bump requirements.in /
  # requirements-test.in and leave the per-arch requirements-linux-*.txt lock
  # outputs alone (they carry no pip-compile header identifying them as
  # compiled artifacts of requirements.in, unlike yamnet's single portable
  # lock). This has NOT been observed against a live Dependabot run for this
  # directory -- it is not verified that Dependabot won't instead open a PR
  # bumping a requirements-linux-*.txt file directly against PyPI, or bump
  # amd64's lock without arm64's.
  #
  # The failure mode if that assumption is wrong is LOUD, not silent: the
  # `aligner-lock-agreement` check below (ci.yml) fails a PR that leaves the
  # two per-arch locks disagreeing on package/version, and the Dockerfile's
  # `--require-hashes` install fails outright if a lock is hand-edited or
  # partially bumped without regenerating its hash set. A torch/torchaudio
  # bump specifically would also risk resolving PyPI's CUDA wheel rather than
  # the pinned `+cpu` build from the PyTorch CPU index --require-hashes was
  # pinning against, which --require-hashes rejects rather than silently
  # installing.
  #
  # Regenerating the hash-pinned locks after a genuine requirements.in /
  # requirements-test.in bump is a follow-up commit, same as yamnet's.
  - package-ecosystem: pip
    directory: /deploy/aligner
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      # Same rationale as yamnet-test-deps: these never ship in the image, so
      # one PR per week beats several that each re-trigger the sidecar build.
      aligner-test-deps:
        patterns:
          - "pytest*"
          - "httpx"
    ignore:
      # Deliberate hold, not a stale pin: torchaudio 2.9 moves load/save onto
      # TorchCodec (its matching 0.8.x has no linux/arm64 wheel) and removes
      # list_audio_backends / torchaudio.functional.forced_align and
      # merge_tokens, which this sidecar's own forced-alignment code calls
      # directly. See requirements.in's own comment on the torch/torchaudio
      # pins for the full rationale. Suppress Dependabot bump PRs for the
      # version this sidecar cannot yet move to, rather than declining the
      # same PR every week.
      - dependency-name: "torch"
        versions: [">=2.9"]
      - dependency-name: "torchaudio"
        versions: [">=2.9"]
