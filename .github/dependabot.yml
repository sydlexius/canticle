version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5
    groups:
      # CodeQL sub-actions (init/analyze/autobuild) cross-check versions at
      # runtime and must move in lockstep; group them so a bump never splits
      # init and analyze across separate PRs (which fails with a config
      # version-mismatch error).
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /build/docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 5

  # The YAMNet sidecar's Python deps. This ecosystem was MISSING while gomod,
  # github-actions, and docker were all covered, so every pinned Python
  # dependency aged silently and Scorecard's Vulnerabilities alert was the only
  # thing that noticed -- after the fact, on main.
  #
  # It is not a hypothetical gap: pinning pytest==8.3.4 (issue #636) landed a
  # version carrying PYSEC-2026-1845, and the pin made it permanent where the
  # previous unpinned install had floated to a patched release. Hash pinning
  # removes the drift that used to accidentally paper over an aging pin, so the
  # pins now REQUIRE an update mechanism rather than merely benefiting from one.
  #
  # Dependabot regenerates the --require-hashes hashes on a bump, so both the
  # runtime lock and the test lock stay installable.
  - package-ecosystem: pip
    directory: /deploy/yamnet-detector
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      # The test tools move together and are never load-bearing at runtime, so a
      # single PR per week beats three that each re-trigger the sidecar build.
      yamnet-test-deps:
        patterns:
          - "pytest*"
          - "httpx"

  # The aligner sidecar's Python deps. requirements.in / requirements-test.in
  # carry the exact top-level pins; the generated, fully hash-pinned locks
  # (requirements-linux-amd64.txt / -arm64.txt / requirements-test.txt, #1017)
  # are regenerated from them per deploy/aligner/README.md.
  #
  # OBSERVED, no longer hypothetical: Dependabot edited the per-arch locks
  # directly, bumping TRANSITIVE packages to versions their parents forbid
  # (#1064 pydantic-core past pydantic's ==pin, #1065 antlr4-python3-runtime
  # past omegaconf's ==4.9.*), leaving both locks unsatisfiable. Cause
  # (dependabot-core PipCompileFileMatcher): a .txt counts as a compiled lock
  # -- its entries indirect -- only if it names itself via --output-file or has
  # a same-basename .in. requirements-linux-*.txt has neither, so every
  # transitive in it parsed as a DIRECT dependency of a plain requirements file.
  #
  # Two controls: `exclude-paths` hides the per-arch locks from Dependabot (the
  # load-bearing one -- `allow: direct` alone cannot help while those entries
  # parse as direct), and `allow: direct` confines bumps to packages named in
  # requirements.in / requirements-test.in (requirements-test.txt matches its
  # .in by basename, so its transitives are correctly indirect). On any such
  # bump, regenerating the locks is a follow-up commit; the ci.yml
  # "Verify aligner locks are fresh" step fails the PR until that lands.
  - package-ecosystem: pip
    directory: /deploy/aligner
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 5
    exclude-paths:
      - "**/requirements-linux-*.txt"
    allow:
      - dependency-type: direct
    groups:
      # Same rationale as yamnet-test-deps: these never ship in the image, so
      # one PR per week beats several that each re-trigger the sidecar build.
      aligner-test-deps:
        patterns:
          - "pytest*"
          - "httpx"
    ignore:
      # Deliberate hold, not a stale pin: torchaudio 2.9 moves load/save onto
      # TorchCodec (its matching 0.8.x has no linux/arm64 wheel) and removes
      # list_audio_backends / torchaudio.functional.forced_align and
      # merge_tokens, which this sidecar's own forced-alignment code calls
      # directly. See requirements.in's own comment on the torch/torchaudio
      # pins for the full rationale. Suppress Dependabot bump PRs for the
      # version this sidecar cannot yet move to, rather than declining the
      # same PR every week.
      - dependency-name: "torch"
        versions: [">=2.9"]
      - dependency-name: "torchaudio"
        versions: [">=2.9"]
