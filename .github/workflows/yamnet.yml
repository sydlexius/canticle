name: YAMNet Sidecar

# Builds and publishes the YAMNet instrumental-detection sidecar image
# (deploy/yamnet-detector/) to GHCR so deployments pull a versioned artifact
# instead of building from a hand-copied local directory (#498).
#
# The image is amd64-only: the linux/amd64 TensorFlow wheel requires AVX, so
# there is no arm64 leg (unlike the app image). This is also why a published
# image matters -- contributors on Apple Silicon cannot build the sidecar at all.

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  # No base-branch filter: a stacked PR targets its parent branch, not main,
  # and a base filter would silently skip CI on it -- a PR with no checks looks
  # much like a PR whose checks passed. A glob (e.g. 'feat/**') has the same
  # failure mode for any branch outside the pattern. This repo is single-trunk,
  # so every PR reaches main eventually and the filter only ever excludes work
  # that should have been tested.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter's documented least-privilege scope for PR change detection

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Sidecar Changes
    runs-on: ubuntu-latest
    # On a tag the output short-circuits to 'true' and the paths-filter step is
    # skipped entirely -- a release must publish the version-tagged sidecar
    # regardless of what the tag commit touched, and paths-filter on a fresh tag
    # ref (no reliable "before" SHA) is exactly the run we must not depend on.
    # So the release publish never rides through paths-filter (finding #498-1).
    outputs:
      sidecar: ${{ github.ref_type == 'tag' || steps.filter.outputs.sidecar == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.ref_type != 'tag'
        with:
          filters: |
            sidecar:
              - 'deploy/yamnet-detector/**'
              - '.github/workflows/yamnet.yml'

  build:
    name: Build & Smoke Test
    runs-on: ubuntu-latest # amd64: the TF wheel needs AVX (no arm64/self-hosted)
    needs: [changes]
    # Build when the sidecar changed, or always on a tag (encoded in the
    # `changes.sidecar` output above, so the tag path does not touch paths-filter).
    if: needs.changes.outputs.sidecar == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build once, load into the local daemon for the smoke test. The publish
      # step below reuses the same GHA layer cache, so this is not a double build.
      - name: Build sidecar image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/yamnet-detector
          file: deploy/yamnet-detector/Dockerfile
          push: false
          load: true
          tags: canticle-yamnet:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # The sidecar's health contract: GET /health -> {"status":"ok","classes":N}
      # with N = the full YAMNet class map (521). A drifted or broken model bake
      # changes the class count, so asserting it catches the whole class of
      # "sidecar starts but is wrong" failures the Go suite cannot see.
      - name: Smoke test (/health)
        run: |
          set -euo pipefail
          docker run -d --name yamnet-smoke -p 8080:8080 canticle-yamnet:smoke
          # Poll up to ~60s for the model to load and the server to bind.
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          echo "health response:"; cat /tmp/health.json; echo
          status=$(jq -r '.status' /tmp/health.json)
          classes=$(jq -r '.classes' /tmp/health.json)
          test "$status" = "ok" || { echo "expected status=ok, got $status" >&2; exit 1; }
          test "$classes" = "521" || { echo "expected classes=521, got $classes" >&2; exit 1; }
          echo "smoke test passed: status=$status classes=$classes"

          # The provenance labels (#682) exist so an operator can answer "did this
          # tag actually change?" from the registry alone, without pulling 1.56GB.
          # That is only worth anything if the labels are TRUE, so verify them
          # against the image that just started rather than trusting the values
          # baked into the Dockerfile.
          #
          # The class-count label is the drift-prone one: it is a literal in the
          # Dockerfile while the real count comes from the SavedModel's own asset
          # map at load time. Checking it against /health closes that loop -- a
          # model swap that changes the map now fails here instead of shipping a
          # label that quietly lies.
          label_classes=$(docker image inspect canticle-yamnet:smoke \
            --format '{{index .Config.Labels "net.sydlexius.canticle.yamnet.model.class-count"}}')
          test "$label_classes" = "$classes" || {
            echo "class-count label ($label_classes) disagrees with /health ($classes)" >&2
            echo "the model changed but the label did not -- update the Dockerfile label" >&2
            exit 1
          }

          # The model sha label must match what the service reports, or the label
          # names weights other than the ones loaded.
          label_sha=$(docker image inspect canticle-yamnet:smoke \
            --format '{{index .Config.Labels "net.sydlexius.canticle.yamnet.model.sha256"}}')
          health_sha=$(jq -r '.model_version // ""' /tmp/health.json)
          test -n "$label_sha" || { echo "model.sha256 label is empty" >&2; exit 1; }
          test "$label_sha" = "$health_sha" || {
            echo "model.sha256 label ($label_sha) disagrees with /health ($health_sha)" >&2
            exit 1
          }
          echo "provenance labels verified against the running image: classes=$label_classes sha=${label_sha:0:12}..."
        # Always dump logs on failure so a broken start is diagnosable in CI.
      - name: Sidecar logs on failure
        if: failure()
        run: docker logs yamnet-smoke || true

      - name: Stop sidecar
        if: always()
        run: docker rm -f yamnet-smoke || true

      # The /classify shape test (test_app.py) stubs the model, so it needs no
      # download and runs in seconds -- it belongs in CI (its former "not in CI"
      # docstring is corrected in this PR). Run it INSIDE the built image so it
      # validates against the exact hash-pinned requirements.txt the sidecar
      # ships, rather than a drift-prone hand-assembled dep list on the runner.
      # `import app` pulls tensorflow/soundfile at module load, so the image's
      # own environment is the only faithful place to run it. test_app.py is not
      # COPYed into the image, so it is bind-mounted read-only for this run.
      - name: Run sidecar shape test (inside the image)
        run: |
          set -euo pipefail
          # --user root: the image drops to appuser (uid 1000), but installing
          # pytest into system site-packages for this throwaway run needs root.
          #
          # --require-hashes against a generated lockfile, not a bare `pip install
          # pytest httpx`: an unpinned install resolves to whatever PyPI serves at
          # run time, which is an unverified dependency executing in CI (Scorecard
          # alert #81, issue #636). Version pins alone do NOT clear the check --
          # hashes are what make the install verifiable.
          docker run --rm --user root \
            -v "$PWD/deploy/yamnet-detector/test_app.py:/app/test_app.py:ro" \
            -v "$PWD/deploy/yamnet-detector/requirements-test.txt:/app/requirements-test.txt:ro" \
            --entrypoint sh canticle-yamnet:smoke -c \
            'pip install --no-cache-dir --quiet --require-hashes -r requirements-test.txt && pytest test_app.py -q'

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: [build]
    # Never publish from a PR or a fork; only push-to-main and release tags.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/<owner>/<repo>-yamnet, tracking the repository like the app image
      # (nightly.yml / release.yml use ghcr.io/${{ github.repository }}). On main:
      # dev + nightly + dated. On a vX.Y.Z tag: the semver tags, mirroring the app.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-yamnet
          # `latest` IS published (metadata-action's default latest=auto: applied
          # only to a non-prerelease semver tag, never to a main push, since those
          # emit only the type=raw tags below).
          #
          # This previously set latest=false, reasoning that a version-pinned
          # sidecar should not have `latest` drifting under it. That rationale was
          # circular -- deployments pinned X.Y.Z because no `latest` existed to
          # track, and the pin was then read back as evidence that pinning was the
          # intent.
          #
          # The real hazard it guarded against was a silent model swap: new weights
          # arriving under a running deployment would re-classify tracks with
          # nothing recording that the classifier had changed. #684 removed that.
          # The loaded model's identity is now the verdict-cache key, read from the
          # sidecar's GET /health: a swap is detected within the cache TTL, logged
          # at INFO with both hashes, and correctly invalidates exactly the verdicts
          # that the previous model produced so they re-infer against the new one.
          # An unknown or too-old sidecar fails closed to re-inference and never to
          # a wrong verdict.
          #
          # So drift is now observable and self-correcting rather than silent, and
          # an operator who wants a frozen classifier can still pin X.Y.Z -- by
          # choice, not for want of an alternative.
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=nightly-{{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/yamnet-detector
          file: deploy/yamnet-detector/Dockerfile
          push: true
          platforms: linux/amd64 # AVX-dependent TF wheel; no arm64 leg
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
