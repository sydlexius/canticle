name: CodeQL

on:
  push:
    branches: [main]
  # No base-branch filter: a stacked PR targets its parent branch, not main,
  # and a base filter would silently skip CI on it -- a PR with no checks looks
  # much like a PR whose checks passed. A glob (e.g. 'feat/**') has the same
  # failure mode for any branch outside the pattern. This repo is single-trunk,
  # so every PR reaches main eventually and the filter only ever excludes work
  # that should have been tested.
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go

      # Generated web UI assets are no longer committed (issue #364); generate
      # them before the traced build so the go:embed of output.css and the
      # generated *_templ.go compile. The build below stays a bare `go build`
      # so CodeQL still traces the real analyzed build.
      - name: Install Tailwind standalone CLI (v4.2.0)
        run: bash scripts/install-tailwind.sh "$RUNNER_TEMP/tailwindcss"

      - name: Generate web UI assets (make generate)
        run: make generate TAILWIND="$RUNNER_TEMP/tailwindcss"

      - name: Build
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:go
        env:
          # Load the local model pack in .github/codeql/extensions, which
          # declares pathutil.ResolveWithinRoot as a path-injection barrier.
          # See that pack's models/pathutil.model.yml for the full rationale.
          #
          # This pair of CLI flags is the ONLY route for a model pack that
          # lives in the repo rather than a registry:
          #   --additional-packs   adds the directory to the pack SEARCH PATH
          #   --extension-packs    activates the pack BY NAME from that path
          # The `packs:` config key cannot express it -- it validates entries
          # against ^[a-z0-9-]+/[a-z0-9-]+$ (codeql-action db-config.ts:273),
          # which a filesystem path cannot match; local paths are a `queries:`
          # feature. codeql-action itself uses exactly these two flags to load
          # its own generated pr-diff-range pack (analyze.ts:421-422).
          #
          # This ADDS a data extension. It does not touch the query suite:
          # disable-default-queries is not set and no `queries:`/`packs:` key
          # exists, so the default suite still runs in full.
          CODEQL_ACTION_EXTRA_OPTIONS: >-
            {"database":{"run-queries":[
            "--additional-packs=${{ github.workspace }}/.github/codeql/extensions",
            "--extension-packs=sydlexius/canticle-go-models"]}}
