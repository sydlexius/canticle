name: Aligner Sidecar Image

# Builds the forced-alignment sidecar image (deploy/aligner/) natively on
# amd64 and arm64 and smoke-tests it against the real ML stack (#1059).
#
# ci.yml's `aligner-test` job runs test_app.py on a bare ubuntu-latest runner
# with a stubbed model layer -- fast, but it never installs either per-arch
# runtime lock (requirements-linux-amd64.txt / requirements-linux-arm64.txt)
# with --require-hashes, never runs the Dockerfile's build-time ML-stack /
# decode-hardening smoke checks, and never exercises the real torch/demucs/
# faster-whisper stack. A broken or stale lock, a missing wheel for one arch,
# or a bad hash would only surface when someone actually builds the image.
# This workflow is that build.
#
# NOT a required check (unlike aligner-test, #1030/#1027): a broken image
# build blocks nobody's merge here, it just fails this workflow's own run,
# so a job-level `if` skipping the whole per-arch job on no relevant change
# is fine -- there is no required-check-missing failure mode to avoid, unlike
# aligner-test's always-running wrapper with step-level `if`s.
#
# NO QEMU: cross-arch emulation misreports one decode security test as exit
# 127 (issue #1059 AC). Both jobs run on NATIVE runners instead --
# ubuntu-latest (amd64) and ubuntu-24.04-arm (arm64) -- so buildx builds for
# the host platform with no `platforms:` override needed.

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  # No base-branch filter: a stacked PR targets its parent branch, not main,
  # and a base filter would silently skip CI on it -- a PR with no checks
  # looks much like a PR whose checks passed (same reasoning as ci.yml).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter's documented least-privilege scope for PR change detection

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Aligner Changes
    runs-on: ubuntu-latest
    # On a tag the output short-circuits to 'true' (same as yamnet.yml): a
    # release must publish the version-tagged image regardless of what the tag
    # commit touched, and paths-filter on a fresh tag ref is not to be trusted.
    outputs:
      aligner: ${{ github.ref_type == 'tag' || steps.filter.outputs.aligner == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.ref_type != 'tag'
        with:
          filters: |
            aligner:
              - 'deploy/aligner/**'
              - '.github/workflows/aligner.yml'

  build-and-smoke:
    name: Build & Smoke Test (${{ matrix.arch }}, ${{ matrix.variant }})
    needs: [changes]
    # Job-level `if`, not step-level: this workflow is not a required check
    # (see the header), so a skipped job costs nothing the way a skipped
    # required-check job would. Mirrors yamnet.yml's `build` job, which is the
    # same shape (native-runner image build + smoke test, non-required).
    # A manual dispatch always builds: it exists to force a validation, and the
    # paths filter can read false for it (last-commit detection on main).
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.aligner == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            variant: cpu
          - arch: arm64
            runner: ubuntu-24.04-arm
            variant: cpu
          # CUDA variant (#1013): amd64 only. Hosted runners have no GPU, so
          # this leg proves the build (hash lock, inverted library check) and
          # that the image falls back to cpu cleanly; on-GPU verification is
          # manual (deploy/aligner/README.md).
          - arch: amd64
            runner: ubuntu-latest
            variant: cuda
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The CUDA image is ~12 GB unpacked (~4.1 GB compressed) and `load: true`
      # holds a second copy while it is exported; free the preinstalled toolchains nobody here uses.
      - name: Free disk space (CUDA image)
        if: matrix.variant == 'cuda'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No `platforms:` -- the runner IS the target arch (no QEMU), so buildx
      # builds natively for the host platform and TARGETARCH resolves to it
      # automatically, selecting the matching per-arch lock in the Dockerfile.
      - name: Build aligner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/aligner
          file: deploy/aligner/Dockerfile
          push: false
          load: true
          build-args: VARIANT=${{ matrix.variant }}
          tags: canticle-aligner:smoke-${{ matrix.arch }}-${{ matrix.variant }}
          # Scoped per arch: amd64 and arm64 build from different per-arch
          # locks (different layers from the `pip install` step onward), so a
          # shared scope would have each arch evict the other's layers on
          # every run (same reasoning as yamnet.yml's scope split). The CUDA
          # leg uses no GHA cache: its pip layer (the CUDA torch and nvidia-* wheels, several GB
          # uncompressed; ~9.3 GB more on disk than the CPU image) would consume most
          # of the repository's 10 GB cache budget and evict everything else.
          cache-from: ${{ matrix.variant == 'cpu' && format('type=gha,scope=aligner-{0}', matrix.arch) || '' }}
          cache-to: ${{ matrix.variant == 'cpu' && format('type=gha,scope=aligner-{0},mode=min', matrix.arch) || '' }}

      # /health is liveness only (models load lazily on first /align, never
      # at boot -- see app.py's lifespan()), so the container should bind
      # within seconds; the retry loop just bounds a slow-starting runner.
      - name: Smoke test (/health)
        run: |
          set -euo pipefail
          docker run -d --name aligner-smoke -p 8080:8080 canticle-aligner:smoke-${{ matrix.arch }}-${{ matrix.variant }}
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          echo "health response:"; cat /tmp/health.json; echo
          status=$(jq -r '.status' /tmp/health.json)
          test "$status" = "ok" || { echo "expected status=ok, got $status" >&2; exit 1; }
          # Hosted runners have no GPU, so every variant must report cpu: the
          # CUDA image has to fall back cleanly rather than fail at startup.
          device=$(jq -r '.device' /tmp/health.json)
          test "$device" = "cpu" || { echo "expected device=cpu on a GPU-less runner, got $device" >&2; exit 1; }
          echo "smoke test passed: status=$status device=$device"

          # CUDA leg: torch is a CUDA build, cuda is importable but reports no
          # device (and the build already ran smoke_cuda.py's library check).
          if [ "${{ matrix.variant }}" = cuda ]; then
            docker exec aligner-smoke python -c "import torch; assert torch.version.cuda, 'not a CUDA torch build'; assert not torch.cuda.is_available(), 'unexpected GPU'; print('torch', torch.__version__, 'cuda', torch.version.cuda)"
          fi

      - name: Sidecar logs on failure
        if: failure()
        run: docker logs aligner-smoke || true

      - name: Stop sidecar
        if: always()
        run: docker rm -f aligner-smoke || true

      # requirements-test.txt is deliberately never installed into the shipped
      # image (it is TEST-only). Install it into a throwaway --rm container
      # from the image just built, same pattern as yamnet.yml's shape test:
      # this validates test_app.py against the EXACT hash-pinned per-arch
      # runtime lock the image ships, rather than a drift-prone runner-side
      # dep list. CI=1 forces the I1 real-ffmpeg security tests to run
      # instead of skipping (test_app.py fails loudly if CI is set and no
      # ffmpeg is found; the image's own apt-installed ffmpeg satisfies it).
      - name: Run aligner sidecar tests (inside the image)
        run: |
          set -euo pipefail
          docker run --rm --user root -e CI=1 \
            -v "$PWD/deploy/aligner/test_app.py:/app/test_app.py:ro" \
            -v "$PWD/deploy/aligner/requirements-test.txt:/app/requirements-test.txt:ro" \
            --entrypoint sh canticle-aligner:smoke-${{ matrix.arch }}-${{ matrix.variant }} -c \
            'pip install --no-cache-dir --quiet --require-hashes -r requirements-test.txt && pytest test_app.py -q'

  # Publishes both variants under ONE image name, ghcr.io/<repo>-aligner (#1013).
  # CPU tags are unsuffixed (dev, nightly, nightly-DATE, X.Y.Z, X.Y, latest);
  # CUDA tags carry a `-cuda` suffix on EVERY tag, `latest` included
  # (dev-cuda, nightly-cuda, nightly-DATE-cuda, X.Y.Z-cuda, X.Y-cuda,
  # latest-cuda). The suffix flavor needs `onlatest=true`: without it
  # metadata-action leaves the `latest` tag unsuffixed and a release would
  # publish the CUDA image as bare :latest, colliding with the CPU image. The
  # two sets are disjoint: every CUDA tag ends in `-cuda`, no CPU tag does.
  # Mirrors yamnet.yml's publish job.
  #
  # CPU is multi-arch without QEMU (see the header): each arch pushes by digest
  # from its NATIVE runner, then publish-cpu-manifest stitches the digests into
  # the tagged manifest list.
  publish-cpu:
    name: Publish CPU image (${{ matrix.arch }})
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    needs: [build-and-smoke]
    # Never publish from a PR or a fork; only push-to-main and release tags.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only (tags are applied to the manifest in publish-cpu-manifest);
      # the image-level OCI labels live in each per-arch image's config, which
      # the manifest list points at.
      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-aligner

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/aligner
          file: deploy/aligner/Dockerfile
          build-args: VARIANT=cpu
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=aligner-${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}-aligner,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aligner-cpu-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-cpu-manifest:
    name: Publish CPU manifest to GHCR
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [publish-cpu]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: aligner-cpu-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-aligner
          flavor: |
            latest=auto
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=nightly-{{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}-aligner
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        env:
          IMAGE: ghcr.io/${{ github.repository }}-aligner
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  publish-cuda:
    name: Publish CUDA image to GHCR
    # Larger than the CPU legs: an uncached ~12 GB build plus a ~4 GB push.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: [build-and-smoke]
    # Never publish from a PR or a fork; only push-to-main and release tags.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-aligner
          flavor: |
            latest=auto
            suffix=-cuda,onlatest=true
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=nightly-{{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/aligner
          file: deploy/aligner/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: VARIANT=cuda
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
