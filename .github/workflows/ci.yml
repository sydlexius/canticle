name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: a stacked PR targets its parent branch, not main,
  # and a base filter would silently skip CI on it -- a PR with no checks looks
  # much like a PR whose checks passed. A glob (e.g. 'feat/**') has the same
  # failure mode for any branch outside the pattern. This repo is single-trunk,
  # so every PR reaches main eventually and the filter only ever excludes work
  # that should have been tested.
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      # Always emits at least one matrix leg so GitHub can interpolate the job
      # name. Non-code PRs get a single placeholder leg marked skip='true' whose
      # build steps no-op. (An empty matrix, or a job skipped via `if:`, instead
      # surfaces the literal, unexpanded "Build (${{ matrix.goos }},
      # ${{ matrix.goarch }})" check name.)
      matrix: ${{ steps.matrix.outputs.matrix }}
      # Shard set for the Test job (issue #662). Always emits at least one leg
      # for the same reason as `matrix` above.
      test_matrix: ${{ steps.matrix.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.goreleaser.yml'
              - '.golangci.yml'
              - '.grype.yaml'
              - 'Dockerfile'
              - 'build/docker/**'
              - 'web/**'

      - name: Compute build and test matrices
        id: matrix
        run: |
          # test_matrix: the shard set consumed by the `test` job. It is GENERATED
          # by scripts/ci-shards.sh rather than written out here, because that
          # script also owns the package map each shard resolves to. Duplicating
          # the shard list in two places has a silent failure mode: a shard named
          # in the map but missing from the matrix has its packages excluded from
          # the dynamic `rest` remainder and therefore run by nobody -- nothing
          # fails, those packages simply stop being tested. One source, no drift.
          # `ci-shards.sh verify` (in the Go Cache Primer job, and in make gate)
          # asserts exactly-once coverage before any shard runs.
          #
          # Non-code diffs get a single representative `rest` shard so the
          # (skipped) job still has a syntactically valid matrix.
          if [ "${{ steps.filter.outputs.code }}" = "true" ]; then
            echo 'matrix={"include":[{"goos":"linux","goarch":"amd64"},{"goos":"linux","goarch":"arm64"},{"goos":"darwin","goarch":"amd64"},{"goos":"darwin","goarch":"arm64"},{"goos":"windows","goarch":"amd64"}]}' >> "$GITHUB_OUTPUT"
            # Assign before emitting: `echo "x=$(cmd)"` exits 0 even when cmd
            # fails, writing an empty value that only surfaces later as a
            # fromJson error in the test job. Assigning fails at the source.
            test_matrix=$(bash scripts/ci-shards.sh matrix)
            echo "test_matrix=${test_matrix}" >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"goos":"linux","goarch":"amd64","skip":"true"}]}' >> "$GITHUB_OUTPUT"
            echo 'test_matrix={"shard":["rest"]}' >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Generated web UI assets are no longer committed (issue #364); generate
      # them before linting so the embed + generated Go compile.
      - name: Install Tailwind standalone CLI (v4.2.0)
        run: bash scripts/install-tailwind.sh "$RUNNER_TEMP/tailwindcss"

      - name: Generate web UI assets (make generate)
        run: make generate TAILWIND="$RUNNER_TEMP/tailwindcss"

      # Validate the freshly generated CSS (sentinel classes + size band).
      # Replaces the removed committed-drift "UI Assets" job: nothing is
      # committed to drift now, but a broken Tailwind run must still fail CI.
      # Lives here rather than in the Go cache primer (#677): the primer no
      # longer runs on pull_request, and this gate must run on EVERY code PR.
      # `lint` already checks out, installs Go and runs `make generate`, so the
      # gate costs only its own runtime and adds no new serial dependency.
      - name: Validate generated web UI assets (make ui-validate)
        run: make ui-validate

      # Assert the test-shard split has not drifted: every package in
      # `go list ./...` lands in exactly one shard, and each partitioned
      # package's buckets are complete and disjoint. This guard exists because
      # the drift failure mode is SILENT -- an unclaimed package is simply never
      # tested and nothing turns red. Also formerly on the primer (#677); `Lint`
      # is a required check, so a drifted split still blocks the merge.
      - name: Verify test-shard split integrity
        run: bash scripts/ci-shards.sh verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          # Weekly (not daily) lint-cache key rotation: a daily interval cold-
          # rebuilds the cache every calendar day and accretes ~7 entries/week.
          cache-invalidation-interval: 7

  # ---------------------------------------------------------------------------
  # Go module + build cache primer for the sharded Test job (issue #662).
  #
  # Warms BOTH halves of the Go cache once and saves them under one entry:
  #   1. go mod download        -> populates the module cache (~/go/pkg/mod)
  #   2. go test -race -run='^$' -> compiles every test binary + dependency WITH
  #      race instrumentation (running zero tests) so the build cache
  #      (~/.cache/go-build) holds the exact race-instrumented objects the
  #      shards' `go test -race` needs. Without this, every shard would
  #      cold-compile -race on each run -- N times the compile the unsharded
  #      job paid once, which would eat the entire sharding win.
  #
  # PUSH-ONLY (#677). Measured on run 30227016700, where a no-primer shard
  # matrix ran CONCURRENTLY with the primer on one commit and one runner pool:
  # the primer does NOT pay for itself on a pull_request. It is a serial prefix
  # (shards wait for it) whose own duration swings 44s-138s, while the shards it
  # unblocks save only ~30-45s each versus warming themselves from restore-keys.
  # Since shards run concurrently, that per-shard saving is paid once in
  # wall-clock and never exceeds the prefix it costs.
  #
  # It still runs on push-to-main, where it is NOT on anyone's critical path and
  # publishes a warm, race-instrumented entry that later PRs pick up through
  # restore-keys. That is the case where a primer genuinely earns its keep.
  #
  # Shards no longer `needs` this job; they restore whatever entry exists via
  # the same key + restore-keys, read-only (no post-job save), so ten concurrent
  # shards never race to write the same key.
  #
  # This job also owns `make ui-validate` (the generated-CSS correctness gate,
  # formerly on the Test job). It runs exactly once instead of once per shard,
  # and because every shard `needs` this job, a broken Tailwind run still fails
  # the pipeline before any shard starts.
  # ---------------------------------------------------------------------------
  go-cache-primer:
    name: Go Cache Primer
    runs-on: ubuntu-latest
    needs: [changes]
    # push-only: see the header above. On a PR the shards warm themselves.
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Disable the built-in cache so the explicit actions/cache step below
          # owns the lifecycle (keyed on go.sum with restore-keys).
          cache: false

      - name: Restore Go module + build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # The key carries a per-commit ${{ github.sha }} suffix because
          # actions/cache NEVER overwrites an existing key: without it the first
          # commit for a given go.sum hash would own the entry forever and every
          # later commit's post-job save would be a silent no-op, leaving the
          # race-instrumented build cache stale. A fresh key per commit means
          # each commit publishes its own warm entry (and a re-run of the same
          # commit gets an exact hit on it).
          # Restore-keys, most-specific first: the go.sum-hash prefix warms from
          # the last entry built against the same dependencies, then a bare Go
          # prefix warms from any Go cache, so a go.sum/go.mod change degrades to
          # a partial warm rather than a cold rebuild. go.mod is hashed too so a
          # toolchain-directive bump that leaves go.sum untouched still
          # invalidates the stale build cache.
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod', '**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('go.mod', '**/go.sum') }}-
            ${{ runner.os }}-go-

      # Generated web UI assets are no longer committed (issue #364). They are
      # needed here because the -race warm-up compiles internal/web, which
      # go:embed's the generated CSS and the templ output.
      - name: Install Tailwind standalone CLI (v4.2.0)
        run: bash scripts/install-tailwind.sh "$RUNNER_TEMP/tailwindcss"

      - name: Generate web UI assets (make generate)
        run: make generate TAILWIND="$RUNNER_TEMP/tailwindcss"

      - name: Warm Go module cache
        run: go mod download

      # -run='^$' matches no test, so this compiles every test binary and
      # dependency with -race and executes nothing. The post-job actions/cache
      # save then captures those objects for the read-only shards.
      - name: Warm Go build cache (race-instrumented)
        run: go test -race -count=1 -run='^$' ./...

  test:
    # Per-shard display names render as "Test Shard (commands-1)",
    # "Test Shard (web)", etc. The bare required check name "Test" is owned by
    # the always-running `test-gate` job further down, so branch protection
    # keeps requiring ONE context instead of enumerating every shard.
    name: Test Shard
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Pure correctness gate: no external-network calls, so a third-party outage
    # (e.g. Codecov) can never fail this required check. Coverage is shipped to
    # Codecov by the separate, non-required `coverage-upload` job.
    permissions:
      contents: read
    strategy:
      # One shard's failure must not cancel the others: with fail-fast a flake
      # in one shard hides real failures in every other shard.
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Disabled: the shard restores the primer's entry read-only below.
          # The primer job owns the cache SAVE; shards only read that key and
          # never write it, so there are no save races between shards.
          cache: false

      # Key/restore-keys are byte-identical to the primer's save step. The
      # primer is push-only now (#677), so the two cases differ:
      #   - re-run of a push commit: the ${{ github.sha }} suffix is an EXACT
      #     hit on the entry that commit's primer published.
      #   - pull_request (the common case): the exact key MISSES and the first
      #     restore-key warms from the last entry built against the same
      #     go.mod/go.sum -- normally the one push-to-main last published.
      # Restore-only (no post-job save), so ten concurrent shards never race to
      # write the same key.
      - name: Restore Go module + build cache (read-only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod', '**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('go.mod', '**/go.sum') }}-
            ${{ runner.os }}-go-

      # Generated web UI assets are regenerated per shard rather than passed
      # between jobs as an artifact. Measured on CI (run 30222557570): the
      # Tailwind install is 1s and `make generate` is 5s, so ~6s -- and because
      # shards run concurrently that 6s is paid once in wall-clock. An artifact
      # upload+download round-trip costs about the same per shard AND adds a
      # cross-job dependency, so regenerating is strictly simpler. Every shard
      # needs them: internal/web go:embed's the generated CSS and templ output,
      # so a shard without them fails to build even when it runs no web test.
      # `make ui-validate` deliberately does NOT run here -- the primer owns it.
      - name: Install Tailwind standalone CLI (v4.2.0)
        run: bash scripts/install-tailwind.sh "$RUNNER_TEMP/tailwindcss"

      - name: Generate web UI assets (make generate)
        run: make generate TAILWIND="$RUNNER_TEMP/tailwindcss"

      # Resolve this shard's package list, and for a partitioned shard its -run
      # bucket regex. Both come from scripts/ci-shards.sh, which is the SINGLE
      # SOURCE OF TRUTH for the split: the same script generated the matrix in
      # the `changes` job above, so the shard names and the package map cannot
      # drift apart. See that script's header for the measured per-package CI
      # times the split is balanced against, and for why internal/commands and
      # internal/queue are partitioned by test name rather than merely given
      # their own shards.
      #
      # `rest` is the DYNAMIC remainder: its package list is derived by
      # excluding every named shard's packages from `go list ./...`, so a newly
      # added package automatically lands in a shard and can never be silently
      # untested.
      - name: Resolve shard package list
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          packages=$(bash scripts/ci-shards.sh packages "$SHARD")
          run=$(bash scripts/ci-shards.sh run "$SHARD")
          echo "shard=$SHARD packages=$packages"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          # The -run regex can be large; use the heredoc form of GITHUB_OUTPUT.
          {
            echo "run<<__RUN_EOF__"
            echo "${run}"
            echo "__RUN_EOF__"
          } >> "$GITHUB_OUTPUT"

      # NOTE: deliberately NO -coverpkg. The unsharded job did not use it
      # either, so each package is instrumented only in its own test binary.
      # Two consequences, both wanted:
      #   1. Per-package coverage keeps meaning "covered by this package's own
      #      tests", so the coverage-floor numbers and the Codecov baseline are
      #      byte-for-byte what they were before sharding.
      #   2. Shard profiles are disjoint by package (the only overlap is the
      #      partitioned shards of a single package, whose counts gocovmerge
      #      sums), which makes the merge exact rather than approximate.
      # Adding -coverpkg=./... would make every shard emit a full-module profile
      # and would credit a package's coverage from other shards' tests, moving
      # every floor.
      - name: Run tests
        # RUN and PACKAGES go through env, not template interpolation, so a
        # large regex cannot break shell quoting. PACKAGES stays UNQUOTED at the
        # use site: it is a space-separated list the shell must word-split into
        # separate `go test` arguments.
        env:
          RUN: ${{ steps.shard.outputs.run }}
          PACKAGES: ${{ steps.shard.outputs.packages }}
        run: |
          if [ -n "$RUN" ]; then
            # shellcheck disable=SC2086 # deliberate word-splitting of the package list
            go test -v -race -count=1 -coverprofile=coverage.out -run "$RUN" $PACKAGES
          else
            # shellcheck disable=SC2086 # deliberate word-splitting of the package list
            go test -v -race -count=1 -coverprofile=coverage.out $PACKAGES
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Unique name per shard so all artifacts survive side by side and the
          # consumer jobs can download them all with `pattern: coverage-*`.
          name: coverage-${{ matrix.shard }}
          path: coverage.out
          retention-days: 1

  scan:
    name: Image Scan
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      security-events: write # required for upload-sarif to publish findings to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        # buildx + GHA layer cache reuses the nightly's exported BuildKit layers
        # instead of cold-building. load:true keeps mxlrcgo-svc:scan in the local
        # daemon so the grype scan step below can still find it.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: mxlrcgo-svc:scan
          cache-from: type=gha

      - name: Scan image for HIGH+ CVEs
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: mxlrcgo-svc:scan
          severity-cutoff: high
          fail-build: true
          grype-version: v0.114.0
          only-fixed: true # transient unfixable CVEs from vuln-DB updates cause flakes that cannot be actioned
          output-format: sarif

      - name: Upload SARIF artifact
        if: always() && steps.scan.outputs.sarif != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-scan-sarif
          path: ${{ steps.scan.outputs.sarif }}
          retention-days: 1

      - name: Upload to Security tab
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Summarize findings on failure
        if: failure()
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif }}
        run: |
          if [ -z "$SARIF_FILE" ] || [ ! -f "$SARIF_FILE" ]; then
            echo "No SARIF output file found; skipping summary."
            exit 0
          fi
          echo "=== Grype findings summary ==="
          jq -r '
            .runs[0] |
            . as $run |
            ($run.tool.driver.rules // []) as $rules |
            .results[] |
            . as $result |
            ($rules | map(select(.id == $result.ruleId)) | first) as $rule |
            "CVE: \($result.ruleId)  severity: \(if $rule then ($rule.properties["security-severity"] // $rule.defaultConfiguration.level // "unknown") else "unknown" end)  package: \($result.message.text // "unknown")"
          ' "$SARIF_FILE" || { echo "(jq failed to parse SARIF)"; cat "$SARIF_FILE"; }

  grype-ignore-expiry:
    name: Grype Ignore Expiry Check
    runs-on: ubuntu-latest
    # Runs unconditionally (not gated on `changes`): a .grype.yaml ignore entry
    # expires by date, independent of whether code changed, so this policy check
    # must fire on every push/PR rather than only when the scan job runs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for expired ignore entries
        run: |
          if [ ! -f .grype.yaml ]; then
            echo "No .grype.yaml found, nothing to check."
            exit 0
          fi
          # escape_gha: escape %, CR, LF before echoing into GHA workflow
          # commands so untrusted .grype.yaml values cannot forge annotations.
          # Order matters: % must be escaped first (to %25) before CR/LF.
          escape_gha() { printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g'; }
          today=$(date -u +%Y-%m-%d)
          errors=0
          vuln=""
          review_by=""
          reason=""
          while IFS= read -r line; do
            # Strip leading whitespace, then skip comments and blank lines
            trimmed=${line#"${line%%[![:space:]]*}"}
            case "$trimmed" in ''|'#'*) continue ;; esac
            case "$trimmed" in
              *"vulnerability:"*)
                # Check previous entry had valid review-by and reason
                if [ -n "$vuln" ]; then
                  if [ -z "$review_by" ]; then
                    echo "::error::Grype ignore missing review-by: $(escape_gha "$vuln")"
                    errors=$((errors + 1))
                  fi
                  if [ -z "$reason" ]; then
                    echo "::error::Grype ignore missing reason: $(escape_gha "$vuln")"
                    errors=$((errors + 1))
                  fi
                fi
                vuln=$(echo "$trimmed" | sed 's/.*vulnerability:[[:space:]]*//; s/"//g')
                review_by=""
                reason=""
                ;;
              *"review-by:"*)
                review_by=$(echo "$trimmed" | sed 's/.*review-by:[[:space:]]*//; s/"//g')
                if ! echo "$review_by" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
                  echo "::error::Invalid review-by format for $(escape_gha "$vuln"): $(escape_gha "$review_by") (expected YYYY-MM-DD)"
                  errors=$((errors + 1))
                elif ! date -ud "$review_by" +%s >/dev/null 2>&1; then
                  echo "::error::Invalid review-by date for $(escape_gha "$vuln"): $(escape_gha "$review_by")"
                  errors=$((errors + 1))
                # review-by is the last valid day; entry expires the day after
                elif [ "$today" '>' "$review_by" ]; then
                  echo "::error::Grype ignore expired: $(escape_gha "$vuln") (review-by: $(escape_gha "$review_by"))"
                  errors=$((errors + 1))
                else
                  days_left=$(( ( $(date -ud "$review_by" +%s) - $(date -ud "$today" +%s) ) / 86400 ))
                  echo "OK: $vuln (review-by: $review_by, ${days_left} days remaining)"
                fi
                ;;
              *"reason:"*)
                reason=$(echo "$trimmed" | sed 's/.*reason:[[:space:]]*//; s/"//g')
                ;;
            esac
          done < .grype.yaml
          # Check the last entry in the file
          if [ -n "$vuln" ]; then
            if [ -z "$review_by" ]; then
              echo "::error::Grype ignore missing review-by: $(escape_gha "$vuln")"
              errors=$((errors + 1))
            fi
            if [ -z "$reason" ]; then
              echo "::error::Grype ignore missing reason: $(escape_gha "$vuln")"
              errors=$((errors + 1))
            fi
          fi
          if [ "$errors" -gt 0 ]; then
            echo "::error::${errors} Grype ignore policy error(s). Review and fix the entries listed above."
            exit 1
          fi
          echo "All Grype ignore entries are within their review-by window."

  coverage-floor:
    name: Coverage Floor
    runs-on: ubuntu-latest
    needs: [test]
    # Enforce the per-package coverage floor (scripts/coverage-floor.json) against
    # the MERGED profile the Test shards produced: a whole-package regression fails
    # here even when Codecov's line-level patch coverage passes. Only runs when
    # Test succeeded; a failed/skipped Test already gates the pipeline.
    # (The Go toolchain is now needed for the gocovmerge step below; the floor
    # script itself is still pure awk over the profile + JSON.)
    if: needs.test.result == 'success'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # One artifact per shard; each lands in its own directory
          # (coverage-web/coverage.out, coverage-commands-1/coverage.out, ...).
          pattern: coverage-*

      - name: Merge coverage profiles
        # `go tool gocovmerge` does a per-BLOCK union, summing hit counts, so each
        # statement block appears exactly ONCE in the output. A naive `cat` of the
        # shard profiles would instead repeat blocks, and coverage-floor.sh sums
        # nstmts per matching line -- so a duplicated block inflates the
        # denominator while the covered numerator stays flat, collapsing every
        # package's ratio and failing the gate with a plausible-looking wrong
        # number rather than an obvious error. That is precisely the silent
        # failure mode issue #662 warns about, hence a real merge tool (pinned via
        # the go.mod tool directive) instead of shell concatenation.
        run: go tool gocovmerge coverage-*/coverage.out > merged-coverage.out

      - name: Enforce per-package coverage floor
        run: bash scripts/coverage-floor.sh --cover merged-coverage.out

  coverage-upload:
    name: Upload Coverage
    runs-on: ubuntu-latest
    needs: [test]
    # Merges the per-shard artifacts the Test job produced and ships one profile
    # to Codecov. Deliberately NOT a required status check: a Codecov outage may
    # fail this job, but it can never block a merge. Only runs when Test passed.
    if: needs.test.result == 'success'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*

      - name: Merge coverage profiles
        # Per-block union merge -- see the identical step in coverage-floor above
        # for why a plain concatenation silently produces wrong numbers.
        run: go tool gocovmerge coverage-*/coverage.out > merged-coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: merged-coverage.out
          # Upload only the merged profile; without this, Codecov's auto-search
          # also picks up the per-shard coverage.out files AND
          # scripts/coverage-floor.json (a config file, not a report).
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true

  build-matrix:
    name: Build (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [changes, lint]
    # Avoid a job-level `if: code == 'true'`: a skipped matrix job surfaces a check
    # named with the literal, unexpanded ${{ matrix.* }} template. Non-code PRs get
    # a single placeholder leg (skip='true', see the `changes` job) whose steps
    # no-op, so the check name still interpolates to a concrete goos/goarch.
    if: ${{ !cancelled() && needs.lint.result != 'failure' }}
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - if: ${{ matrix.skip != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ matrix.skip != 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Generated web UI assets are no longer committed (issue #364); generate
      # them before the build so the go:embed of output.css resolves.
      - name: Install Tailwind standalone CLI (v4.2.0)
        if: ${{ matrix.skip != 'true' }}
        run: bash scripts/install-tailwind.sh "$RUNNER_TEMP/tailwindcss"

      - name: Generate web UI assets (make generate)
        if: ${{ matrix.skip != 'true' }}
        run: make generate TAILWIND="$RUNNER_TEMP/tailwindcss"

      - name: Build binary
        if: ${{ matrix.skip != 'true' }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o mxlrcgo-svc ./cmd/mxlrcgo-svc

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, build-matrix]
    if: always()
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Detect Changes did not succeed: ${{ needs.changes.result }}"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "No code changes detected, skipping build"
            exit 0
          fi
          result="${{ needs.build-matrix.result }}"
          # "skipped" means a required upstream job (e.g. lint) failed and the
          # matrix never ran -- that upstream failure is reported separately.
          # Only exit 1 when the matrix itself encountered a job failure.
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "Build matrix failed or cancelled: $result"
            exit 1
          fi

  # Always-running required-check wrappers for Lint/Test (mirrors the Build gate
  # above). The real lint/test jobs are gated on `code` and SKIP on non-code PRs;
  # a skipped job can never satisfy a required status check, which structurally
  # blocked config/docs-only PRs. These wrappers always run and report the
  # required "Lint"/"Test" contexts: pass when there are no code changes, else
  # mirror the real job's result.
  lint-gate:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: always()
    steps:
      - name: Gate on lint result
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Detect Changes did not succeed: ${{ needs.changes.result }}"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "No code changes detected; lint not required."
            exit 0
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint failed: ${{ needs.lint.result }}"
            exit 1
          fi
          echo "Lint passed."

  test-gate:
    name: Test
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: always()
    steps:
      - name: Gate on test result
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Detect Changes did not succeed: ${{ needs.changes.result }}"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "No code changes detected; test not required."
            exit 0
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test failed: ${{ needs.test.result }}"
            exit 1
          fi
          echo "Test passed."
