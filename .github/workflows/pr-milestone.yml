# Automatically assign a milestone to PRs based on the issues they reference.
# Parses "Fixes #N", "Closes #N", "Resolves #N", and "Part of #N" from the PR
# body, looks up each issue's milestone, and assigns the first one found.
# Warns via comment if referenced issues have conflicting milestones, and deletes
# that comment once the references no longer conflict.
#
# Ported from sydlexius/stillwater's pr-milestone.yml. Canticle organizes its
# backlog into domain milestones (Instrumental Detection, Word-Sync & Generation,
# Lyric Timing & Validation, ...), so a PR closing a filed issue inherits that
# issue's domain automatically.
#
# Only assigns when the PR has NO milestone -- a manual choice is never
# overwritten. Uses pull_request_target so a fork PR cannot redefine the logic.
#
# PR comments are untrusted: anyone can post the conflict note's sentinel text.
# The note is therefore found by the sentinel AND its author being this
# workflow's bot (github-actions[bot]), so a planted sentinel is never updated or
# deleted. The lookup runs on every run, so a stale note is removed once an edit
# leaves the references in one milestone, in none, or absent. If a referenced
# issue cannot be read (other than not existing), the note is left as it is for
# that run.

name: PR Milestone

on:
  pull_request_target:
    types: [opened, edited]
    # No base-branch filter: a stacked PR targets its parent branch, not main, and a
    # filter would skip this on it. Guarded by scripts/check-pr-trigger-scope.sh.

permissions: {}

jobs:
  assign-milestone:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: write
    # Skip bot PRs (Dependabot, etc.) -- they never reference milestone issues
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Assign milestone from linked issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            // Parse issue references: Fixes #N, Closes #N, Resolves #N, Part of #N.
            // `Part of #N` is the house convention for an epic-child PR: it links
            // the PR to the epic WITHOUT auto-closing it (GitHub only auto-closes
            // on fixes/closes/resolves). Omitting it from this pattern would make
            // the automation silently skip a PR that references only its epic.
            const pattern = /\b(?:fix(?:e[sd])?|close[sd]?|resolve[sd]?|part\s+of)\s+#(\d+)/gi;
            const issueNumbers = [];
            let match;
            while ((match = pattern.exec(body)) !== null) {
              const num = parseInt(match[1], 10);
              if (!issueNumbers.includes(num)) {
                issueNumbers.push(num);
              }
            }

            // No early return on an empty list: the conflict-note cleanup below
            // must still run when an edit removed every reference.
            core.info(issueNumbers.length > 0
              ? `Found issue references: ${issueNumbers.map(n => '#' + n).join(', ')}`
              : 'No issue references found in PR body');

            // Look up milestones for each referenced issue
            // A referenced number that does not exist (404) has no milestone. Any
            // other read failure leaves the set of milestones unknown, so the
            // conflict note below is left alone rather than judged on part of it.
            const milestones = new Map();
            let incomplete = false;
            for (const num of issueNumbers) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                });
                if (issue.data.pull_request) {
                  core.info(`#${num} is a pull request, skipping`);
                  continue;
                }
                if (issue.data.milestone) {
                  const ms = issue.data.milestone;
                  if (!milestones.has(ms.number)) {
                    milestones.set(ms.number, { title: ms.title, number: ms.number, issues: [] });
                  }
                  milestones.get(ms.number).issues.push(num);
                }
              } catch (err) {
                if (err.status !== 404) incomplete = true;
                core.warning(`Could not fetch issue #${num}: ${err.message}`);
              }
            }

            const entries = Array.from(milestones.values());
            const target = entries[0];

            // Keep the conflict note in step with the current references (upsert to
            // avoid spam, delete once stale). Only a comment written by this
            // workflow's bot counts as the note: the sentinel is plain text a PR
            // author could plant in their own comment, but a comment's author
            // cannot be forged.
            const sentinel = '<!-- pr-milestone-conflict -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            // Every matching note, not only the first: an older copy of this
            // workflow read only the first page of comments and could post a
            // second note, so extras are removed here.
            const notes = comments.filter(c => c.body && c.body.includes(sentinel)
              && c.user && c.user.type === 'Bot' && c.user.login === 'github-actions[bot]');
            const [existing, ...extras] = notes;
            // Another run on the same PR may already have deleted a note: a 404
            // here means it is gone, which is the goal.
            const deleteNote = async (c) => {
              try {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            };

            if (incomplete) {
              core.warning('A referenced issue could not be read; the conflict note is left as it is.');
            } else if (milestones.size > 1) {
              const list = entries
                .map(m => `- **${m.title}** (from ${m.issues.map(n => '#' + n).join(', ')})`)
                .join('\n');
              const warningBody = [
                sentinel,
                'This PR references issues from multiple milestones:',
                '',
                list,
                '',
                `Auto-assigned the milestone from the first match: **${target.title}**.`,
                'Update manually if this is incorrect.',
              ].join('\n');

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: warningBody,
                });
                core.info('Updated existing conflict warning comment');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: warningBody,
                });
              }

              for (const c of extras) {
                await deleteNote(c);
              }

              core.warning(`Conflicting milestones detected, assigned "${target.title}"`);
            } else if (notes.length > 0) {
              for (const c of notes) {
                await deleteNote(c);
              }
              core.info('Removed the conflict warning comment: references no longer span milestones');
            }

            if (!target) {
              core.info('No referenced issues have milestones, nothing to assign');
              return;
            }

            // Only auto-assign when the PR has no milestone; respect manual choices
            if (pr.milestone) {
              core.info(`PR already has milestone "${pr.milestone.title}", not overwriting`);
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              milestone: target.number,
            });

            core.info(`Assigned milestone "${target.title}" to PR #${pr.number}`);
